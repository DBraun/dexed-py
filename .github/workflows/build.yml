name: Build Python wheels

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - { python-version: "3.11", cibwbuild: "cp311-manylinux_x86_64"}
        - { python-version: "3.12", cibwbuild: "cp312-manylinux_x86_64"}
        - { python-version: "3.13", cibwbuild: "cp313-manylinux_x86_64"}
        - { python-version: "3.14", cibwbuild: "cp314-manylinux_x86_64" }
        - { python-version: "3.14t", cibwbuild: "cp314t-manylinux_x86_64"}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Initialize submodules
      run: |
        git submodule update --init --recursive
        echo "Verifying nanobind..."
        ls -la nanobind/ || echo "Warning: nanobind directory not found"
        if [ -d "nanobind" ]; then
          echo "Nanobind submodule found"
          ls -la nanobind/ext/ || echo "Warning: nanobind/ext not found"
        fi

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.4.0
      env:
        CIBW_PLATFORM: linux
        CIBW_BUILD: ${{ matrix.cibwbuild }}
        CIBW_BUILD_VERBOSITY: 3
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_BEFORE_BUILD_LINUX: "ls -la {project}/nanobind/ && ls -la {project}/nanobind/ext/ || echo 'Missing nanobind submodules'"
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: auditwheel repair -w {dest_dir} {wheel}
        CIBW_TEST_COMMAND: "cd {project}/tests && python -m pytest -v ."
        CIBW_ARCHS: auto64
        CIBW_ARCHS_LINUX: auto64

    - uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.cibwbuild }}
        path: ./wheelhouse/*.whl

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-14, build: cp311-macosx_arm64, python-version: "3.11", ARCHS: "arm64" }
        - { os: macos-14, build: cp312-macosx_arm64, python-version: "3.12", ARCHS: "arm64" }
        - { os: macos-14, build: cp313-macosx_arm64, python-version: "3.13", ARCHS: "arm64" }
        - { os: macos-14, build: cp314-macosx_arm64, python-version: "3.14", ARCHS: "arm64" }
        - { os: macos-14, build: cp314t-macosx_arm64, python-version: "3.14t", ARCHS: "arm64" }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get CMake
      uses: lukka/get-cmake@latest

    - name: Build wheels ${{ matrix.python-version }}
      uses: pypa/cibuildwheel@v3.4.0
      env:
        PYTHONMAJOR: ${{ matrix.python-version }}
        MACOSX_DEPLOYMENT_TARGET: 11.0
        CIBW_BUILD_VERBOSITY: 1
        CIBW_TEST_COMMAND: "cd {project}/tests && python -m pytest -v ."
        CIBW_BUILD: ${{matrix.build}}
        CIBW_ARCHS: auto64
        CIBW_ARCHS_MACOS: ${{matrix.ARCHS}}
        CIBW_ENVIRONMENT_MACOS: CMAKE_OSX_ARCHITECTURES="${{matrix.ARCHS}}"

    - uses: actions/upload-artifact@v4
      with:
        name: artifact-macos-${{ matrix.build }}
        path: ./wheelhouse/*.whl

  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: windows-2022, python-version: "3.11", CIBW-BUILD: "cp311*"}
        - { os: windows-2022, python-version: "3.12", CIBW-BUILD: "cp312*"}
        - { os: windows-2022, python-version: "3.13", CIBW-BUILD: "cp313*"}
        - { os: windows-2022, python-version: "3.14", CIBW-BUILD: "cp314*" }
        - { os: windows-2022, python-version: "3.14t", CIBW-BUILD: "cp314t*" }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get CMake
      uses: lukka/get-cmake@latest

    - name: Build Wheels
      uses: pypa/cibuildwheel@v3.4.0
      env:
        PYTHONMAJOR: ${{ matrix.python-version }}
        CIBW_BUILD_VERBOSITY: 1
        CIBW_TEST_COMMAND: "cd /D {project}\\tests && python -m pytest -v ."
        CIBW_ARCHS: auto64
        CIBW_BUILD: ${{matrix.CIBW-BUILD}}

    - uses: actions/upload-artifact@v4
      with:
        name: artifact-windows-${{ matrix.python-version }}
        path: ./wheelhouse/*.whl

  docs:
    runs-on: ubuntu-latest
    needs: [build-ubuntu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: artifact-cp312-manylinux_x86_64
          path: dist

      - name: Install package and docs dependencies
        run: |
          pip install dist/*.whl
          pip install sphinx myst-parser sphinx-rtd-theme sphinx-llm sphinx-autodoc-typehints

      - name: Build docs
        run: cd docs && make html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  upload-pypi:
    needs: [build-windows, build-ubuntu, build-macos]
    runs-on: ubuntu-latest
    name: "Upload wheels to PyPI"
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1